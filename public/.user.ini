; Butterfly PHP — настройки PHP для shared-хостинга (PHP-FPM/CGI).
; На части хостингов .user.ini не применяется — тогда задайте то же в панели.

display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

memory_limit = 128M
max_execution_time = 30
post_max_size = 2M
upload_max_filesize = 2M

date.timezone = Europe/Moscow
opcache.enable = 1
