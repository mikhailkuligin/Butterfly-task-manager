name: Bug report
description: Сообщить об ошибке в Butterfly PHP
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение. Не прикладывайте пароли, токены и `.env`.
  - type: textarea
    id: what
    attributes:
      label: Что произошло
      description: Опишите фактическое поведение.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть ...
        2. Нажать ...
        3. Увидеть ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия / окружение
      description: PHP, MySQL, браузер, или commit SHA.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Логи/скриншоты
      description: Без секретов и персональных данных.
      render: shell
    validations:
      required: false
